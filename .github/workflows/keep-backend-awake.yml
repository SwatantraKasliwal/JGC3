# Pings the API from outside so it does not sit spun down.
#
# app/keepalive.py already pings from inside the process, which is enough while
# the instance is up. It cannot help once the instance is *down*, because the
# pinger is a task in the very process Render stopped. This workflow is the
# other half: an outside caller wakes a sleeping instance, and from then on the
# in-process pinger keeps it up.
#
# Free on GitHub-hosted runners for a public repository; a private repository
# spends included Actions minutes (~10s per run, so a few minutes a month).
#
# The URL falls back to the production service below, so a fresh clone or a
# repository with no Actions variables configured still pings the right host
# instead of failing every ten minutes. Override it per repository with a
# variable named BACKEND_URL (Settings → Secrets and variables → Actions →
# Variables) — no trailing slash. Nothing secret goes in here: /health returns
# a service name and "ok", and a variable rather than a secret keeps it
# readable in the run log when a ping fails.
#
# GitHub throttles scheduled workflows on busy runners, so a */10 schedule can
# be delivered late or skipped. That is why this is the waker and not the thing
# keeping the instance warm.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  # So it can be fired by hand after a deploy rather than waiting for the tick.
  workflow_dispatch:

# A late run must not queue up behind the previous one.
concurrency:
  group: keep-backend-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          # vars.BACKEND_URL is empty on a repository that never set it, and an
          # empty value here used to fail the run outright — 68 red runs and an
          # email each while the service itself was perfectly healthy.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://jaikvin-global-api.onrender.com' }}
        run: |
          set -u
          url="${BACKEND_URL%/}/health"
          # --max-time 90: a cold start is the case this exists for, and it
          # takes about a minute. --retry covers the redeploy window, where the
          # router answers 502 for a few seconds.
          code=$(curl --silent --show-error --location \
                      --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors \
                      --output /dev/stderr --write-out '%{http_code}' \
                      -A 'jaikvin-keepalive-ci/1.0' \
                      "$url") || true
          echo "$url -> ${code:-no response}"
          # 200 is the only healthy answer; anything else is worth a red run
          # rather than a green one that pinged nothing.
          [ "$code" = "200" ]
